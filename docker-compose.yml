services:
  card29:
    build:
      context: .
      args:
        NODE_VERSION: 22.23.4
        ALPINE_VERSION: "3.24"
    image: card29
    container_name: card29
    init: true # tiny init as PID 1: forwards SIGTERM so the server shuts rooms down cleanly
    restart: unless-stopped
    ports:
      # Behind nginx on this same machine, prefer "127.0.0.1:5050:5050" so players
      # can only reach the game through the proxy.
      - "5050:5050"
    environment:
      PORT: "5050"
      # Behind nginx (see deploy/nginx/): the public site address, e.g. https://card29.example.com.
      # Used for the lobby join link / QR code, canonical URL, sitemap and the WebSocket origin check.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Behind nginx: 1 = trust its X-Forwarded-Host / X-Forwarded-Proto headers.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # LAN play without a proxy: this host's LAN IP (Docker only sees its own 172.x network).
      ADVERTISE_ADDRESS: ${ADVERTISE_ADDRESS:-}
    # Hardening: the server keeps all state in memory and never writes to disk.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Optional local nginx in front of the game, to try the reverse-proxy setup:
  #   PUBLIC_URL=http://localhost:8080 TRUST_PROXY=1 docker compose --profile proxy up -d
  # then open http://localhost:8080. Production config: deploy/nginx/card29.conf.
  nginx:
    image: nginx:1.30.6-alpine
    container_name: card29-nginx
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      card29:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/docker-test.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/card29-proxy.conf:/etc/nginx/snippets/card29-proxy.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
