# Card 29 — plain-HTTP nginx used by `docker compose --profile proxy up`
# to try the reverse-proxy setup locally on http://localhost:8080.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream card29_upstream {
    server card29:5050;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    include /etc/nginx/snippets/card29-proxy.conf;
}
