# Card 29 — reverse-proxy rules, shared by card29.conf (production) and
# docker-test.conf (local test). Include it inside a `server { }` block that
# serves the site at its root (sub-paths are not supported), and define the
# `card29_upstream` upstream and the `$connection_upgrade` map in http context.
#
# The game server must run with:
#   PUBLIC_URL=https://your-domain      (join links, canonical URL, sitemap, origin check)
#   TRUST_PROXY=1                       (reads the X-Forwarded-* headers set below)

# Compress text assets on the way out (the Node server sends them uncompressed).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

# Game WebSocket. Players sit idle for minutes while others think, so the
# timeouts are long; the server pings every 10 s to detect dead sockets.
location = /ws {
    proxy_pass http://card29_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # $http_host keeps a non-default port (e.g. :8080), which the origin check compares.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
}

# Page, assets, /api/info, robots.txt and sitemap.xml. The server sets
# long-lived cache headers on hashed /assets/ files.
location / {
    proxy_pass http://card29_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}
