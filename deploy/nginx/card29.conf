# Card 29 — production site for nginx (put in /etc/nginx/conf.d/ or sites-enabled/).
#   1. Replace card29.example.com and the certificate paths.
#   2. Copy card29-proxy.conf to /etc/nginx/snippets/.
#   3. Run the game server with PUBLIC_URL=https://card29.example.com TRUST_PROXY=1,
#      reachable at the upstream address below (Docker: map 5050:5050, or put nginx
#      on the same Compose network and use card29:5050).
#   4. nginx -t && nginx -s reload

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream card29_upstream {
    server 127.0.0.1:5050;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name card29.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name card29.example.com;

    ssl_certificate     /etc/letsencrypt/live/card29.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/card29.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/snippets/card29-proxy.conf;
}
